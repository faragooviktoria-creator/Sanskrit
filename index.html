<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Szanszkrit tanulókártyák</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#222} .app{max-width:900px;width:95%;text-align:center} h1{font-size:2rem} .stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 20px}.pill{background:#fff;padding:10px 16px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08)} .scene{perspective:1000px}.card{height:320px;max-width:450px;margin:0 auto;cursor:pointer;position:relative} .face{position:absolute;inset:0;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:30px;font-size:1.8rem;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.12);}.back{font-size:1.35rem;font-weight:400;line-height:1.5;display:none} .controls,.learn{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px} button{border:none;padding:12px 18px;border-radius:12px;background:#2563eb;color:#fff;font-size:1rem;cursor:pointer} button:hover{opacity:.92}.secondary{background:#6b7280}.good{background:#16a34a}.bad{background:#dc2626}.reset{background:#7c3aed}@media(max-width:600px){.face{font-size:1.35rem}.back{font-size:1.05rem;height:auto}}</style></head><body><div class="app"><h1>Szanszkrit és nyelvtörténeti tanulókártyák</h1><div class="stats"><div class="pill" id="counter"></div><div class="pill" id="known"></div></div><div class="scene"><div class="card" id="card"><div class="face" id="front"></div><div class="face back" id="back"></div></div></div><div class="controls"><button onclick="prevCard()">← Előző</button><button onclick="flipCard()">Megfordít</button><button onclick="nextCard()">Következő →</button><button class="secondary" onclick="shuffleCards()">🔀 Keverés</button></div><div class="learn"><button class="good" onclick="markKnown()">Tudom</button><button class="bad" onclick="markUnknown()">Nem tudom</button><button class="reset" onclick="resetProgress()">Újrakezdés</button></div></div><script>const cards=[['Nyelvrokonság','Két vagy több nyelv közös, régebbi alapnyelvből származik.'],['Nyelvcsalád – ág','A nyelvcsalád közös eredetű nyelvek csoportja; az ág ezen belül egy kisebb rokoni csoport.'],['Nyelvi univerzálék','Olyan tulajdonságok, amelyek sok vagy akár minden emberi nyelvben megtalálhatók.'],['Kognátumok','Közös eredetű, egymással történetileg rokon szavak különböző nyelvekben.'],['Összehasonlító módszer','Rokon nyelvek rendszeres összevetésével rekonstruáljuk közös elődjüket és a változásokat.'],['Hangtörvények','Olyan szabályos hangváltozások, amelyek egy nyelvben meghatározott környezetben következetesen végbemennek.'],['Rendszeres hangmegfelelések','Rokon nyelvek hangjai között szabályosan ismétlődő megfelelések.'],['Hangváltozások','A beszédhangok kiejtésének és rendszerének történeti megváltozása.'],['Újgrammatikus hipotézis','A hangváltozások szabályosak és azonos környezetben kivételek nélkül mennek végbe.'],['Proto-indoeurópai alapnyelv','Az indoeurópai nyelvek feltételezett közös őse.'],['Laringális elmélet','Elmélet, amely szerint a proto-indoeurópaiban később eltűnt gégehangok, laringálisok is léteztek.'],['Családfa-elmélet','A nyelvek fejlődését elágazó családfaként ábrázolja, közös ősből kiindulva.'],['Hullámelmélet','A nyelvi változások hullámokban terjednek egyik beszélőközösségből a másikba.'],['Nyelvi újítások','Új nyelvi formák vagy használati módok, amelyek egy nyelvben megjelennek.'],['Izoglosszák','Térképen megrajzolt vonalak, amelyek egy nyelvi jelenség elterjedési határát mutatják.'],['Nyelvtipológia','A nyelvek szerkezetük és működésük alapján történő összehasonlítása és csoportosítása.'],['Morfológia','A szavak felépítésének és alakváltozásainak vizsgálata.'],['Szintaktikai','A mondatok felépítésével és a szavak mondatbeli kapcsolatával kapcsolatos.'],['Agglutináló nyelv','Olyan nyelv, amelyben a nyelvtani jelentéseket különálló toldalékok kapcsolásával fejezik ki.'],['Flektáló nyelv','Olyan nyelv, amelyben egyetlen toldalék egyszerre több nyelvtani jelentést is kifejezhet.'],['Izoláló nyelv','Olyan nyelv, amelyben a szavak alig változnak; a nyelvtani viszonyokat főleg különálló szavak és a szórend fejezi ki.'],['Inkorporáló nyelv','Olyan nyelv, amelyben egyetlen szó nagyon sok jelentéselemet, akár egy egész mondatnyi tartalmat is kifejezhet.'],['Szintaxis','A mondatok felépítésének és a szavak mondatbeli kapcsolatainak vizsgálata.'],['Védák','Az indiai vallási hagyomány legősibb szent szövegei; a védikus szanszkrit fontos forrásai.'],['Apauruṣeya (apauruseya)','„Nem ember által alkotott”; a hagyomány szerint a Védák örök, emberfeletti eredetűek.'],['Śabda (sabda)','„Szó”, „hang”, illetve a szent vagy megbízható szóbeli tanítás.'],['Ācārya (acarya)','Tanító vagy mester, aki a hagyományt továbbadja tanítványainak.'],['Śabda-pramāṇa (sabda-pramana)','A hiteles szóbeli vagy szöveges tanítás mint érvényes tudásforrás.'],['Mantra-śakti (mantra-sakti)','A mantra ereje vagy hatása; a hagyomány szerint a mantra hangalakja és helyes recitálása fontos.'],['Siddhānta (siddhanta)','Megalapozott tanítás, elv vagy filozófiai álláspont.'],['Paramparā-validáció','A tanítás hitelességének ellenőrzése a tanítómesterek folyamatos hagyományláncán keresztül.'],['Saṃskṛta (samskrta)','„Művelt, tökéletesített, megszerkesztett”; a szanszkrit hagyományos neve.'],['Védikus szanszkrit','A Védák nyelve; a szanszkrit legrégebbi ismert formája.'],['Klasszikus szanszkrit','A későbbi, szabályozott és irodalmi szanszkrit, amelyet Pāṇini nyelvtana is meghatározott.']];let idx=0,knownSet=new Set();const card=document.getElementById('card');function render(){front.textContent=cards[idx][0];back.textContent=cards[idx][1];counter.textContent=(idx+1)+' / '+cards.length;known.textContent='Tudott kártyák: '+knownSet.size+' / '+cards.length;document.getElementById('front').style.display='flex';document.getElementById('back').style.display='none'}function flipCard(){const f=document.getElementById('front');const b=document.getElementById('back'); const showBack=b.style.display==='flex'; b.style.display=showBack?'none':'flex'; f.style.display=showBack?'flex':'none';}function nextCard(){idx=(idx+1)%cards.length;render()}function prevCard(){idx=(idx-1+cards.length)%cards.length;render()}function shuffleCards(){for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;render()}function markKnown(){knownSet.add(cards[idx][0]);nextCard()}function markUnknown(){nextCard()}function resetProgress(){knownSet.clear();idx=0;render()}card.onclick=flipCard;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextCard();if(e.key==='ArrowLeft')prevCard();if(e.code==='Space'){e.preventDefault();flipCard();}});render();</script></body></html>
